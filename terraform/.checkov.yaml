compact: true
quiet: true

# Each skipped check below is a deliberate design decision for this learning
# repo, not an unnoticed gap. Reasoning matches the cost-control and
# "learn AWS behavior hands-on" principles documented in CLAUDE.md.
skip-check:
  # --- Cost control: these all cost extra money for a lab that gets destroyed
  # right after each exercise, with no real workload to justify the spend ---
  - CKV_AWS_126 # EC2 detailed monitoring - extra CloudWatch cost
  - CKV_AWS_50  # Lambda X-Ray tracing - extra cost, unnecessary for a hello-world demo
  - CKV_AWS_353 # RDS Performance Insights - extra cost
  - CKV_AWS_118 # RDS enhanced monitoring - extra cost
  - CKV_AWS_129 # RDS log exports to CloudWatch - extra cost/complexity for a throwaway DB
  - CKV_AWS_157 # RDS Multi-AZ - doubles both compute and storage cost; single-AZ is intentional for this learning phase
  - CKV_AWS_76  # API Gateway access logging - extra CloudWatch cost

  # --- Intentional for hands-on verification / demo purposes ---
  - CKV_AWS_17  # RDS publicly_accessible=true - deliberate, so we can connect directly from a laptop to test
  - CKV_AWS_260 # SG ingress 0.0.0.0/0:80 - deliberate, so the demo web server is reachable for curl testing
  - CKV_AWS_382 # SG egress 0.0.0.0/0:-1 - standard "allow all outbound" default, not a real exposure
  - CKV_AWS_130 # Subnet auto-assigns public IP - that is the definition of "public subnet" in this VPC design
  - CKV_AWS_309 # API Gateway route has no authorization - public hello-world demo endpoint, no auth needed
  - CKV_AWS_231 # NACL allows ingress to 3389 - leftover from the stateful-vs-stateless NACL comparison exercise (Phase 2), resource already destroyed

  # --- Enterprise-grade hardening that's overkill for a single-function demo ---
  - CKV_AWS_117 # Lambda not in a VPC - intentional; avoids needing a NAT Gateway just for Lambda to reach AWS APIs
  - CKV_AWS_116 # Lambda has no Dead Letter Queue - unnecessary resilience feature for a demo function
  - CKV_AWS_272 # Lambda code-signing not configured - enterprise supply-chain control, out of scope here
  - CKV_AWS_115 # Lambda has no reserved concurrency limit - unnecessary for a function invoked manually a handful of times
  - CKV_AWS_161 # RDS IAM authentication not enabled - adds complexity with no benefit over the Secrets-Manager-managed password already in use
  - CKV_AWS_135 # EC2 not EBS-optimized - modern instance types are EBS-optimized by default; not a real gap

  # --- We WANT this off, since we destroy the DB after every lab ---
  - CKV_AWS_293 # RDS deletion protection - must stay off, or `terraform destroy` will fail every time

  # --- Lock table / non-precious data: default AWS-owned encryption is enough ---
  - CKV_AWS_28  # DynamoDB point-in-time recovery - this table only holds Terraform state locks, not data worth restoring
  - CKV_AWS_119 # DynamoDB customer-managed KMS key - default AWS-owned key encryption is sufficient for a lock table, avoids an extra $1/month KMS key

  # --- Cost/complexity found on a second checkov pass (graph checks) ---
  - CKV_AWS_18  # S3 access logging - needs a separate log-target bucket, unnecessary cost/complexity for throwaway learning buckets
  - CKV2_AWS_11 # VPC flow logs - extra CloudWatch Logs cost, unnecessary for a VPC destroyed after each lab
  - CKV_AWS_144 # S3 cross-region replication - extra replica storage + transfer cost, way overkill for a single learning bucket
  - CKV_AWS_145 # S3 encrypted with customer-managed KMS - AES256 SSE (already enabled) is sufficient encryption at rest; a CMK adds ~$1/month for no real benefit here
  - CKV2_AWS_41 # EC2 has no attached IAM role - this instance only serves nginx and makes no AWS API calls, so it needs none
  - CKV2_AWS_62 # S3 event notifications - most buckets in this repo don't need event-driven processing; the one that does (Phase 6 uploads bucket) already has it
  - CKV2_AWS_5  # SG not attached to any resource - the Phase 2 networking demo intentionally builds the SG without launching an instance, since that phase is about network topology, not compute

  # --- Phase 11 (ECS/EKS): cost control on short-lived container demos ---
  - CKV_AWS_65  # ECS Container Insights - extra CloudWatch metrics/logs cost, unnecessary for a demo cluster
  - CKV_AWS_158 # CloudWatch Log Group encrypted with customer-managed KMS - default AWS-owned key encryption is sufficient, avoids an extra $1/month KMS key
  - CKV_AWS_338 # CloudWatch log retention >= 1 year - directly conflicts with this repo's "destroy immediately after each lab" principle; 7 days is intentional
  - CKV_AWS_58  # EKS secrets encryption via customer KMS key - adds cost/complexity for a cluster that only lives for a short verification window
  - CKV_AWS_37  # EKS control plane logging for all log types - extra CloudWatch Logs cost, unnecessary for a short-lived demo cluster

  # --- Phase 11 (ECS/EKS): intentional for hands-on verification, or overkill for a hello-world demo ---
  - CKV_AWS_336 # ECS container read-only root filesystem - the stock nginx:latest image needs writable paths (cache, temp, pid) and would break without extra volume/tmpfs config; out of scope for this demo
  - CKV_AWS_39  # EKS public endpoint enabled - needed for direct kubectl access from a laptop without a VPN/bastion; access is restricted to my own IP via public_access_cidrs (see CKV_AWS_38, which is fixed, not skipped)
  - CKV_AWS_333 # ECS service auto-assigns a public IP - deliberate, since this phase intentionally skips ALB to focus on ECS/Fargate concepts; the capstone project replaces this with a private subnet + ALB

  # --- Capstone: no HTTPS, since this project has no purchased/registered domain name
  # to issue an ACM certificate against. HTTP-only is the deliberate, documented tradeoff. ---
  - CKV_AWS_2   # ALB listener protocol should be HTTPS
  - CKV_AWS_103 # Load balancer should use at least TLS 1.2
  - CKV_AWS_378 # Load balancer shouldn't use HTTP protocol
  - CKV2_AWS_20 # ALB should redirect HTTP to HTTPS

  # --- Capstone: cost control / overkill for a portfolio demo torn down after verification ---
  - CKV_AWS_150 # ALB deletion protection - must stay off, so `terraform destroy` works cleanly
  - CKV_AWS_91  # ALB access logging - needs a separate S3 log-target bucket, unnecessary cost/complexity for a demo
  - CKV2_AWS_28 # Public ALB protected by WAF - WAF has a monthly base fee plus per-rule cost, way overkill for a demo

  # --- Capstone: false positive from checkov's static analysis ---
  - CKV_AWS_249 # execution role ARN and task role ARN must differ - they genuinely are two separate modules/roles
                # (module.execution_role vs module.task_role), but both ARNs are "(known after apply)" at plan
                # time, so checkov can't statically prove they differ and fails safe instead of passing
