<svg width="980" height="880" viewBox="0 0 980 880" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Capstone three-tier architecture: ALB + ECS Fargate + RDS across two AZs, with CI/CD and remote state</title>
<desc>Users reach an Application Load Balancer in the public subnets through the Internet Gateway. The ALB forwards traffic to ECS Fargate tasks running in private subnets across two availability zones. Those tasks reach a private RDS MySQL instance (subnet group spanning both AZs, single-AZ instance) restricted to the task security group, and reach the internet only outbound through a NAT Gateway in the public subnet, for pulling the container image. Outside the VPC, GitHub Actions assumes an IAM role via OIDC to run terraform plan and apply against this whole architecture, and Terraform's own state is stored remotely in an S3 bucket with DynamoDB locking.</desc>
<style>
  rect { rx: 8px; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  text.th { font-size: 14px; font-weight: 500; }
  text.ts { font-size: 12px; font-weight: 400; }
  text.tl { font-size: 12px; font-weight: 500; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray .th { fill: #2C2C2A; } .c-gray .ts { fill: #5F5E5A; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .c-blue .th { fill: #0C447C; } .c-blue .ts { fill: #185FA5; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
  .arr-dash { stroke: #73726c; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
  .boundary { fill: none; stroke: #8a897f; stroke-width: 1; stroke-dasharray: 3 3; }
</style>
