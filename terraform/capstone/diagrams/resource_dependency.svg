<svg width="1040" height="920" viewBox="0 0 1040 920" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Capstone Terraform resource dependency graph</title>
<desc>module.vpc's outputs (vpc_id, public and private subnet ids) feed the security groups, the NAT Gateway, the ALB, the ECS service, and the RDS module. Two IAM role modules feed the ECS task definition with an execution role and a task role. A security-group chain restricts access: the ALB security group is the only allowed source into the ECS task security group, which in turn is the only allowed source into the RDS module's internal security group. The ALB chain (load balancer, target group, listener) and the ECS chain (cluster, log group, task definition) both converge into the ECS service, which registers into the target group and depends on the listener existing first. The ECS service and the RDS module are connected only through the security group chain, not a direct Terraform reference.</desc>
<style>
  rect { rx: 8px; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  text.th { font-size: 14px; font-weight: 500; }
  text.ts { font-size: 12px; font-weight: 400; }
  text.tl { font-size: 12px; font-weight: 500; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray .th { fill: #2C2C2A; } .c-gray .ts { fill: #5F5E5A; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .c-blue .th { fill: #0C447C; } .c-blue .ts { fill: #185FA5; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
  .arr-dash { stroke: #73726c; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="c-blue">
<rect x="400" y="16" width="240" height="56"/>
<text class="th" x="520" y="38" text-anchor="middle">module.vpc</text>
<text class="ts" x="520" y="56" text-anchor="middle">vpc_id, public/private subnet ids</text>
</g>

<path d="M420,72 C260,110 160,110 130,140" class="arr" marker-end="url(#arrow)"/>
<path d="M480,72 C440,110 420,110 400,140" class="arr" marker-end="url(#arrow)"/>
<path d="M560,72 C620,110 660,110 680,140" class="arr" marker-end="url(#arrow)"/>
<path d="M480,72 L200,340" class="arr" marker-end="url(#arrow)"/>
<path d="M560,72 L520,224" class="arr" marker-end="url(#arrow)"/>
<path d="M600,72 L840,660" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="20" y="142" width="220" height="56"/>
<text class="th" x="130" y="162" text-anchor="middle">IAM: execution_role + task_role</text>
<text class="ts" x="130" y="180" text-anchor="middle">two modules.iam-role calls</text>
</g>

<g class="c-gray">
<rect x="280" y="142" width="240" height="56"/>
<text class="th" x="400" y="162" text-anchor="middle">Security Groups</text>
<text class="ts" x="400" y="180" text-anchor="middle">alb / ecs_task / database (in module)</text>
</g>

<g class="c-gray">
<rect x="560" y="142" width="240" height="56"/>
<text class="th" x="680" y="162" text-anchor="middle">NAT Gateway + private route table</text>
<text class="ts" x="680" y="180" text-anchor="middle">eip, nat, 2x route_table_association</text>
</g>

<text class="ts" x="400" y="205" text-anchor="middle" fill="#5F5E5A">SG chain: alb -&gt; ecs_task -&gt; database (each is the only allowed ingress source for the next)</text>

<path d="M130,198 L280,268" class="arr" marker-end="url(#arrow)"/>
<path d="M340,198 L280,268" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="60" y="270" width="280" height="56"/>
<text class="th" x="200" y="290" text-anchor="middle">aws_lb -&gt; target_group -&gt; listener</text>
<text class="ts" x="200" y="308" text-anchor="middle">public subnets, alb SG</text>
</g>

<g class="c-coral">
<rect x="420" y="226" width="280" height="56"/>
<text class="th" x="560" y="246" text-anchor="middle">ECS cluster + log group</text>
<text class="ts" x="560" y="264" text-anchor="middle">-&gt; aws_ecs_task_definition</text>
</g>

<path d="M130,198 L560,224" class="arr" marker-end="url(#arrow)"/>

<path d="M200,326 L440,430" class="arr" marker-end="url(#arrow)"/>
<path d="M560,282 L480,430" class="arr" marker-end="url(#arrow)"/>
<path d="M400,198 L440,430" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
<rect x="360" y="432" width="280" height="66"/>
<text class="th" x="500" y="454" text-anchor="middle">aws_ecs_service</text>
<text class="ts" x="500" y="470" text-anchor="middle">private subnets, ecs_task SG,</text>
<text class="ts" x="500" y="486" text-anchor="middle">registers into target_group</text>
</g>

<path d="M200,326 L500,432" class="arr-dash" marker-end="url(#arrow)"/>
<text class="ts" x="230" y="390" text-anchor="middle" fill="#5F5E5A">depends_on listener</text>

<path d="M400,198 L840,630" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
<rect x="700" y="600" width="280" height="66"/>
<text class="th" x="840" y="622" text-anchor="middle">module.database (RDS)</text>
<text class="ts" x="840" y="638" text-anchor="middle">private subnets, publicly_accessible=false</text>
<text class="ts" x="840" y="654" text-anchor="middle">ingress: ecs_task SG only</text>
</g>

<text class="ts" x="600" y="560" text-anchor="middle" fill="#5F5E5A">no direct Terraform reference between ecs_service and database -</text>
<text class="ts" x="600" y="576" text-anchor="middle" fill="#5F5E5A">connected only through the security group chain above</text>

<g class="c-gray">
<rect x="120" y="760" width="800" height="90" rx="12" stroke-width="0.5"/>
<text class="th" x="520" y="784" text-anchor="middle">Remote state backend (separate root module)</text>
<text class="ts" x="520" y="804" text-anchor="middle">phase1-backend/bootstrap, -var="unique_suffix=ddliu2026-capstone"</text>
<text class="ts" x="520" y="822" text-anchor="middle">S3 bucket + DynamoDB lock table - referenced via capstone/main.tf's backend "s3" block,</text>
<text class="ts" x="520" y="838" text-anchor="middle">not a resource this configuration manages directly</text>
</g>
</svg>
