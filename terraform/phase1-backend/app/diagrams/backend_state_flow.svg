<svg width="680" height="230" viewBox="0 0 680 230" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How the app module uses the bootstrap-created backend</title>
<desc>Running terraform apply in the app module writes its state to the S3 bucket and acquires a lock via the DynamoDB table, both created earlier by the bootstrap module.</desc>
<style>
  rect { rx: 8px; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  text.th { font-size: 14px; font-weight: 500; }
  text.ts { font-size: 12px; font-weight: 400; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray .th { fill: #2C2C2A; } .c-gray .ts { fill: #5F5E5A; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .c-blue .th { fill: #0C447C; } .c-blue .ts { fill: #185FA5; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="c-gray">
<rect x="250" y="30" width="180" height="56"/>
<text class="th" x="340" y="48" text-anchor="middle">terraform apply</text>
<text class="ts" x="340" y="66" text-anchor="middle">app module</text>
</g>

<path d="M340,86 L190,148" class="arr" marker-end="url(#arrow)"/>
<path d="M340,86 L490,148" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue">
<rect x="90" y="150" width="200" height="56"/>
<text class="th" x="190" y="168" text-anchor="middle">S3 bucket</text>
<text class="ts" x="190" y="186" text-anchor="middle">stores state</text>
</g>

<g class="c-coral">
<rect x="390" y="150" width="200" height="56"/>
<text class="th" x="490" y="168" text-anchor="middle">DynamoDB table</text>
<text class="ts" x="490" y="186" text-anchor="middle">state lock</text>
</g>
</svg>
