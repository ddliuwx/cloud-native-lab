<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Dependency graph for the Phase 1 bootstrap resources</title>
<desc>The S3 bucket feeds versioning and server-side encryption as sibling configuration resources. The DynamoDB lock table is created independently, with no dependency relationship to the bucket.</desc>
<style>
  rect { rx: 8px; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  text.th { font-size: 14px; font-weight: 500; }
  text.ts { font-size: 12px; font-weight: 400; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .c-blue .th { fill: #0C447C; } .c-blue .ts { fill: #185FA5; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="c-blue">
<rect x="250" y="40" width="180" height="56"/>
<text class="th" x="340" y="58" text-anchor="middle">S3 bucket</text>
<text class="ts" x="340" y="76" text-anchor="middle">tf_state</text>
</g>

<path d="M340,96 L180,158" class="arr" marker-end="url(#arrow)"/>
<path d="M340,96 L490,158" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="90" y="160" width="180" height="56"/>
<text class="th" x="180" y="178" text-anchor="middle">Versioning</text>
<text class="ts" x="180" y="196" text-anchor="middle">enabled</text>
</g>

<g class="c-purple">
<rect x="390" y="160" width="200" height="56"/>
<text class="th" x="490" y="178" text-anchor="middle">Server-side encryption</text>
<text class="ts" x="490" y="196" text-anchor="middle">AES256</text>
</g>

<g class="c-coral">
<rect x="250" y="280" width="180" height="56"/>
<text class="th" x="340" y="298" text-anchor="middle">DynamoDB table</text>
<text class="ts" x="340" y="316" text-anchor="middle">independent</text>
</g>
</svg>
