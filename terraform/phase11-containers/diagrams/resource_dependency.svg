<path d="M500,76 L660,208" class="arr" marker-end="url(#arrow)"/>

<text class="th" x="220" y="440" text-anchor="middle" fill="#3C3489">ECS side</text>
<text class="th" x="680" y="440" text-anchor="middle" fill="#712B13">EKS side</text>

