<text class="ts" x="440" y="480" text-anchor="middle">curl public IP</text>
<text class="ts" x="440" y="498" text-anchor="middle">(ECS side) &#8195;&#8195;&#8195;&#8195;&#8195;&#8195;&#8195;&#8195;&#8195;&#8195;&#8195; kubectl via access entry (EKS side)</text>
