<svg width="680" height="335" viewBox="0 0 680 335" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Minimal VPC topology with public and private subnets</title>
<desc>The internet connects through an internet gateway into a VPC's public subnet, which has a route to the gateway. The private subnet has no such route and is isolated from the internet in both directions.</desc>
<style>
  rect { rx: 8px; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  text.th { font-size: 14px; font-weight: 500; }
  text.ts { font-size: 12px; font-weight: 400; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray .th { fill: #2C2C2A; } .c-gray .ts { fill: #5F5E5A; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .c-blue .th { fill: #0C447C; } .c-blue .ts { fill: #185FA5; }
  .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .c-teal .th { fill: #085041; } .c-teal .ts { fill: #0F6E56; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text class="ts" x="70" y="168" text-anchor="middle" fill="#5F5E5A">Internet</text>
<line x1="70" y1="178" x2="138" y2="178" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="140" y="156" width="170" height="44"/>
<text class="th" x="225" y="178" text-anchor="middle" dominant-baseline="central">Internet gateway</text>
</g>

<path d="M312,178 L358,199" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue">
<rect x="340" y="50" width="290" height="240" rx="20"/>
<text class="th" x="485" y="80" text-anchor="middle">VPC</text>
<text class="ts" x="485" y="98" text-anchor="middle">10.0.0.0/16</text>
</g>

<g class="c-teal">
<rect x="360" y="130" width="115" height="140" rx="12"/>
<text class="th" x="417" y="185" text-anchor="middle" dominant-baseline="central">Public</text>
<text class="ts" x="417" y="215" text-anchor="middle" dominant-baseline="central">10.0.1.0/24</text>
</g>

<g class="c-gray">
<rect x="495" y="130" width="115" height="140" rx="12"/>
<text class="th" x="552" y="185" text-anchor="middle" dominant-baseline="central">Private</text>
<text class="ts" x="552" y="215" text-anchor="middle" dominant-baseline="central">10.0.2.0/24</text>
</g>

<text class="ts" x="485" y="315" text-anchor="middle" fill="#5F5E5A">Private subnet — isolated (no route)</text>
</svg>
