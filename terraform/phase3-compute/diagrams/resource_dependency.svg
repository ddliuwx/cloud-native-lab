<svg width="680" height="350" viewBox="0 0 680 350" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Dependency graph for the Phase 3 EC2 compute resources</title>
<desc>The default VPC data source feeds the subnets data source and the security group. The subnets data source, security group, AMI data source, and key pair all converge on the EC2 instance. The AMI data source and key pair are independent, with no dependency on the VPC.</desc>
<style>
  rect { rx: 8px; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  text.th { font-size: 14px; font-weight: 500; }
  text.ts { font-size: 12px; font-weight: 400; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray .th { fill: #2C2C2A; } .c-gray .ts { fill: #5F5E5A; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .c-blue .th { fill: #0C447C; } .c-blue .ts { fill: #185FA5; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="c-gray">
<rect x="250" y="30" width="180" height="56"/>
<text class="th" x="340" y="48" text-anchor="middle">VPC</text>
<text class="ts" x="340" y="66" text-anchor="middle">data source, default</text>
</g>

<path d="M340,86 L110,128" class="arr" marker-end="url(#arrow)"/>
<path d="M340,86 L275,128" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="40" y="130" width="140" height="56"/>
<text class="th" x="110" y="148" text-anchor="middle">Subnets</text>
<text class="ts" x="110" y="166" text-anchor="middle">data source</text>
</g>

<g class="c-blue">
<rect x="200" y="130" width="150" height="56"/>
<text class="th" x="275" y="148" text-anchor="middle">Security group</text>
<text class="ts" x="275" y="166" text-anchor="middle">HTTP + SSH</text>
</g>

<g class="c-gray">
<rect x="370" y="130" width="130" height="56"/>
<text class="th" x="435" y="148" text-anchor="middle">AMI</text>
<text class="ts" x="435" y="166" text-anchor="middle">data source</text>
</g>

<g class="c-blue">
<rect x="520" y="130" width="120" height="56"/>
<text class="th" x="580" y="148" text-anchor="middle">Key pair</text>
<text class="ts" x="580" y="166" text-anchor="middle">deployer</text>
</g>

<path d="M110,186 L260,250" class="arr" marker-end="url(#arrow)"/>
<path d="M275,186 L300,250" class="arr" marker-end="url(#arrow)"/>
<path d="M435,186 L400,250" class="arr" marker-end="url(#arrow)"/>
<path d="M580,186 L440,250" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
<rect x="220" y="250" width="240" height="56"/>
<text class="th" x="340" y="268" text-anchor="middle">EC2 instance</text>
<text class="ts" x="340" y="286" text-anchor="middle">web, t3.micro</text>
</g>
</svg>
