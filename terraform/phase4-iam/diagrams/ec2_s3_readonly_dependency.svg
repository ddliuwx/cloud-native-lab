<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Dependency graph for the EC2-to-S3 read-only IAM setup</title>
<desc>A trust policy document feeds an IAM role, a permission policy document feeds an IAM policy, both the role and policy feed a policy attachment, and the role separately feeds an instance profile.</desc>
<style>
  rect { rx: 8px; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  text.th { font-size: 14px; font-weight: 500; }
  text.ts { font-size: 12px; font-weight: 400; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray .th { fill: #2C2C2A; } .c-gray .ts { fill: #5F5E5A; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .c-blue .th { fill: #0C447C; } .c-blue .ts { fill: #185FA5; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="c-gray">
<rect x="90" y="40" width="180" height="56"/>
<text class="th" x="180" y="58" text-anchor="middle">Trust policy</text>
<text class="ts" x="180" y="76" text-anchor="middle">data source</text>
</g>

<g class="c-gray">
<rect x="390" y="40" width="200" height="56"/>
<text class="th" x="490" y="58" text-anchor="middle">Permission policy</text>
<text class="ts" x="490" y="76" text-anchor="middle">data source</text>
</g>

<line x1="180" y1="96" x2="180" y2="138" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="96" x2="490" y2="138" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue">
<rect x="90" y="140" width="180" height="56"/>
<text class="th" x="180" y="158" text-anchor="middle">IAM role</text>
<text class="ts" x="180" y="176" text-anchor="middle">ec2_s3_readonly</text>
</g>

<g class="c-purple">
<rect x="390" y="140" width="200" height="56"/>
<text class="th" x="490" y="158" text-anchor="middle">IAM policy</text>
<text class="ts" x="490" y="176" text-anchor="middle">s3_readonly</text>
</g>

<path d="M180,196 L222,250" class="arr" marker-end="url(#arrow)"/>
<path d="M490,196 L418,250" class="arr" marker-end="url(#arrow)"/>
<path d="M180,196 L180,215 L120,215 L120,338" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="180" y="250" width="280" height="56"/>
<text class="th" x="320" y="268" text-anchor="middle">Policy attachment</text>
<text class="ts" x="320" y="286" text-anchor="middle">binds policy to role</text>
</g>

<g class="c-blue">
<rect x="40" y="340" width="160" height="56"/>
<text class="th" x="120" y="358" text-anchor="middle">Instance profile</text>
<text class="ts" x="120" y="376" text-anchor="middle">wraps the role</text>
</g>
</svg>
