<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Dependency graph for the GitHub Actions OIDC IAM setup</title>
<desc>An OIDC provider feeds a trust policy document, which feeds an IAM role. A separate permission policy document feeds an IAM policy. Both the role and policy feed a policy attachment.</desc>
<style>
  rect { rx: 8px; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  text.th { font-size: 14px; font-weight: 500; }
  text.ts { font-size: 12px; font-weight: 400; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray .th { fill: #2C2C2A; } .c-gray .ts { fill: #5F5E5A; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .c-blue .th { fill: #0C447C; } .c-blue .ts { fill: #185FA5; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="c-blue">
<rect x="90" y="40" width="200" height="56"/>
<text class="th" x="190" y="58" text-anchor="middle">OIDC provider</text>
<text class="ts" x="190" y="76" text-anchor="middle">github</text>
</g>

<line x1="190" y1="96" x2="190" y2="138" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="90" y="140" width="200" height="56"/>
<text class="th" x="190" y="158" text-anchor="middle">Trust policy</text>
<text class="ts" x="190" y="176" text-anchor="middle">data source</text>
</g>

<g class="c-gray">
<rect x="390" y="140" width="200" height="56"/>
<text class="th" x="490" y="158" text-anchor="middle">Permission policy</text>
<text class="ts" x="490" y="176" text-anchor="middle">data source</text>
</g>

<line x1="190" y1="196" x2="190" y2="248" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="196" x2="490" y2="248" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue">
<rect x="90" y="250" width="200" height="56"/>
<text class="th" x="190" y="268" text-anchor="middle">IAM role</text>
<text class="ts" x="190" y="286" text-anchor="middle">github_actions</text>
</g>

<g class="c-purple">
<rect x="390" y="250" width="200" height="56"/>
<text class="th" x="490" y="268" text-anchor="middle">IAM policy</text>
<text class="ts" x="490" y="286" text-anchor="middle">github_actions_minimal</text>
</g>

<path d="M190,306 L230,360" class="arr" marker-end="url(#arrow)"/>
<path d="M490,306 L410,360" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="180" y="360" width="280" height="56"/>
<text class="th" x="320" y="378" text-anchor="middle">Policy attachment</text>
<text class="ts" x="320" y="396" text-anchor="middle">binds policy to role</text>
</g>
</svg>
