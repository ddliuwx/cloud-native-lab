<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Dependency graph for the Phase 5 RDS database resources</title>
<desc>The default VPC data source feeds both a subnets data source and a security group. The subnets data source feeds a DB subnet group. The DB subnet group and security group both feed the DB instance, which in turn causes AWS to auto-create a Secrets Manager secret outside of Terraform's state.</desc>
<style>
  rect { rx: 8px; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  text.th { font-size: 14px; font-weight: 500; }
  text.ts { font-size: 12px; font-weight: 400; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray .th { fill: #2C2C2A; } .c-gray .ts { fill: #5F5E5A; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .c-blue .th { fill: #0C447C; } .c-blue .ts { fill: #185FA5; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="c-gray">
<rect x="250" y="40" width="180" height="56"/>
<text class="th" x="340" y="58" text-anchor="middle">VPC</text>
<text class="ts" x="340" y="76" text-anchor="middle">data source</text>
</g>

<path d="M340,96 L190,138" class="arr" marker-end="url(#arrow)"/>
<path d="M340,96 L530,138" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="90" y="140" width="200" height="56"/>
<text class="th" x="190" y="158" text-anchor="middle">Subnets</text>
<text class="ts" x="190" y="176" text-anchor="middle">data source</text>
</g>

<g class="c-blue">
<rect x="430" y="140" width="200" height="56"/>
<text class="th" x="530" y="158" text-anchor="middle">Security group</text>
<text class="ts" x="530" y="176" text-anchor="middle">rds, port 3306</text>
</g>

<path d="M190,196 L200,248" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue">
<rect x="90" y="250" width="220" height="56"/>
<text class="th" x="200" y="268" text-anchor="middle">DB subnet group</text>
<text class="ts" x="200" y="286" text-anchor="middle">spans 2+ AZs</text>
</g>

<path d="M200,306 L260,358" class="arr" marker-end="url(#arrow)"/>
<path d="M530,196 L420,358" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
<rect x="180" y="360" width="280" height="56"/>
<text class="th" x="320" y="378" text-anchor="middle">DB instance</text>
<text class="ts" x="320" y="396" text-anchor="middle">db.t3.micro mysql</text>
</g>

<line x1="462" y1="388" x2="488" y2="388" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="490" y="360" width="150" height="56" stroke-dasharray="4 3"/>
<text class="th" x="565" y="378" text-anchor="middle">Secrets Manager</text>
<text class="ts" x="565" y="396" text-anchor="middle">auto-created</text>
</g>
</svg>
