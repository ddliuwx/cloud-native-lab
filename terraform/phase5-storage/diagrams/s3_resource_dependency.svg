<svg width="680" height="270" viewBox="0 0 680 270" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Dependency graph for the Phase 5 S3 storage resources</title>
<desc>The S3 bucket is the base resource. Three independent configuration resources — versioning, server-side encryption, and lifecycle rule — each attach to the bucket, with no dependency between them.</desc>
<style>
  rect { rx: 8px; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  text.th { font-size: 14px; font-weight: 500; }
  text.ts { font-size: 12px; font-weight: 400; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .c-blue .th { fill: #0C447C; } .c-blue .ts { fill: #185FA5; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="c-blue">
<rect x="250" y="40" width="180" height="56"/>
<text class="th" x="340" y="58" text-anchor="middle">S3 bucket</text>
<text class="ts" x="340" y="76" text-anchor="middle">app_data</text>
</g>

<path d="M340,96 L115,168" class="arr" marker-end="url(#arrow)"/>
<path d="M340,96 L320,168" class="arr" marker-end="url(#arrow)"/>
<path d="M340,96 L545,168" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="40" y="170" width="150" height="56"/>
<text class="th" x="115" y="188" text-anchor="middle">Versioning</text>
<text class="ts" x="115" y="206" text-anchor="middle">enabled</text>
</g>

<g class="c-purple">
<rect x="210" y="170" width="220" height="56"/>
<text class="th" x="320" y="188" text-anchor="middle">Server-side encryption</text>
<text class="ts" x="320" y="206" text-anchor="middle">AES256</text>
</g>

<g class="c-purple">
<rect x="450" y="170" width="190" height="56"/>
<text class="th" x="545" y="188" text-anchor="middle">Lifecycle rule</text>
<text class="ts" x="545" y="206" text-anchor="middle">expire noncurrent @30d</text>
</g>
</svg>
