<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Cross-module dependency graph for Phase 7</title>
<desc>The vpc module feeds both the ec2 module and the database module. The lambda_role module feeds the hello_lambda module. Three other module calls — ec2_s3_readonly_role, github_actions_role, and app_data_bucket — exist but only exchange inputs and outputs with the root module, not with each other.</desc>
<style>
  rect { rx: 8px; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  text.th { font-size: 14px; font-weight: 500; }
  text.ts { font-size: 12px; font-weight: 400; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .c-blue .th { fill: #0C447C; } .c-blue .ts { fill: #185FA5; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="c-blue">
<rect x="90" y="30" width="160" height="56"/>
<text class="th" x="170" y="48" text-anchor="middle">module.vpc</text>
<text class="ts" x="170" y="66" text-anchor="middle">vpc_id, subnet ids</text>
</g>

<g class="c-purple">
<rect x="430" y="30" width="180" height="56"/>
<text class="th" x="520" y="48" text-anchor="middle">module.lambda_role</text>
<text class="ts" x="520" y="66" text-anchor="middle">role_arn</text>
</g>

<path d="M170,86 L115,138" class="arr" marker-end="url(#arrow)"/>
<path d="M170,86 L295,138" class="arr" marker-end="url(#arrow)"/>
<path d="M520,86 L545,138" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue">
<rect x="40" y="140" width="150" height="56"/>
<text class="th" x="115" y="158" text-anchor="middle">module.ec2</text>
<text class="ts" x="115" y="176" text-anchor="middle">vpc_id, subnet_id</text>
</g>

<g class="c-coral">
<rect x="210" y="140" width="170" height="56"/>
<text class="th" x="295" y="158" text-anchor="middle">module.database</text>
<text class="ts" x="295" y="176" text-anchor="middle">vpc_id, 2 subnet ids</text>
</g>

<g class="c-blue">
<rect x="460" y="140" width="170" height="56"/>
<text class="th" x="545" y="158" text-anchor="middle">module.hello_lambda</text>
<text class="ts" x="545" y="176" text-anchor="middle">role_arn</text>
</g>

<text class="ts" x="340" y="225" text-anchor="middle" fill="#5F5E5A">Standalone: ec2_s3_readonly_role, github_actions_role, app_data_bucket</text>
<text class="ts" x="340" y="242" text-anchor="middle" fill="#5F5E5A">(inputs/outputs only touch the root module, not each other)</text>
</svg>
