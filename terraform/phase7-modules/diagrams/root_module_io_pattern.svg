<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How the root module and a child module exchange data, using module.hello_lambda as the example</title>
<desc>The root module passes literal arguments into module.hello_lambda's variables when calling it. Module.lambda_role's role_arn output also flows in as a cross-module input. Module.hello_lambda's own outputs.tf then exposes values back out, readable from the root module as module.hello_lambda.function_name.</desc>
<style>
  rect { rx: 8px; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  text.th { font-size: 14px; font-weight: 500; }
  text.ts { font-size: 12px; font-weight: 400; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray .th { fill: #2C2C2A; } .c-gray .ts { fill: #5F5E5A; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .c-blue .th { fill: #0C447C; } .c-blue .ts { fill: #185FA5; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="c-purple">
<rect x="380" y="20" width="220" height="56"/>
<text class="th" x="490" y="38" text-anchor="middle">module.lambda_role</text>
<text class="ts" x="490" y="56" text-anchor="middle">another module's output</text>
</g>

<text class="ts" x="325" y="112" text-anchor="middle" fill="#5F5E5A">function_name, source_file, handler</text>
<line x1="210" y1="118" x2="378" y2="118" class="arr" marker-end="url(#arrow)"/>

<text class="ts" x="325" y="152" text-anchor="middle" fill="#5F5E5A">module.hello_lambda.function_name</text>
<line x1="378" y1="140" x2="210" y2="140" class="arr" marker-end="url(#arrow)"/>

<path d="M490,76 L490,98" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="540" y="90" text-anchor="middle" fill="#5F5E5A">role_arn</text>

<g class="c-gray">
<rect x="40" y="100" width="170" height="56"/>
<text class="th" x="125" y="118" text-anchor="middle">Root module</text>
<text class="ts" x="125" y="136" text-anchor="middle">phase7-modules</text>
</g>

<g class="c-blue">
<rect x="380" y="100" width="220" height="56"/>
<text class="th" x="490" y="118" text-anchor="middle">module.hello_lambda</text>
<text class="ts" x="490" y="136" text-anchor="middle">modules/lambda</text>
</g>

<text class="ts" x="340" y="215" text-anchor="middle" fill="#5F5E5A">Two kinds of input: literal values from the module block,</text>
<text class="ts" x="340" y="232" text-anchor="middle" fill="#5F5E5A">and another module's output referenced directly</text>
</svg>
