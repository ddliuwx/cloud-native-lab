<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How the workspace model separates state while sharing one backend</title>
<desc>One root module's code branches based on the built-in terraform.workspace value into two separate state files, both stored inside the same shared backend configuration.</desc>
<style>
  rect { rx: 8px; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  text.th { font-size: 14px; font-weight: 500; }
  text.ts { font-size: 12px; font-weight: 400; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .c-blue .th { fill: #0C447C; } .c-blue .ts { fill: #185FA5; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray .th { fill: #2C2C2A; } .c-gray .ts { fill: #5F5E5A; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="c-blue">
<rect x="250" y="30" width="180" height="56"/>
<text class="th" x="340" y="48" text-anchor="middle">workspace-demo/</text>
<text class="ts" x="340" y="66" text-anchor="middle">one root module</text>
</g>

<text class="ts" x="200" y="152" text-anchor="middle" fill="#5F5E5A">workspace = dev</text>
<path d="M340,86 L230,228" class="arr" marker-end="url(#arrow)"/>

<text class="ts" x="480" y="152" text-anchor="middle" fill="#5F5E5A">workspace = prod</text>
<path d="M340,86 L450,228" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="90" y="170" width="500" height="130" rx="20" stroke-width="0.5"/>
<text class="th" x="110" y="200" text-anchor="start">Shared backend</text>
<text class="ts" x="110" y="218" text-anchor="start">same config, different state paths</text>
</g>

<g class="c-coral">
<rect x="140" y="230" width="180" height="56"/>
<text class="th" x="230" y="248" text-anchor="middle">dev state</text>
<text class="ts" x="230" y="266" text-anchor="middle">terraform.tfstate.d/dev</text>
</g>

<g class="c-coral">
<rect x="360" y="230" width="180" height="56"/>
<text class="th" x="450" y="248" text-anchor="middle">prod state</text>
<text class="ts" x="450" y="266" text-anchor="middle">terraform.tfstate.d/prod</text>
</g>
</svg>
