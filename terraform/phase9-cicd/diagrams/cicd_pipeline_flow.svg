<svg width="720" height="520" viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Phase 9 CI/CD pipeline: PR to AWS via GitHub Actions OIDC</title>
<desc>A pull request triggers a GitHub Actions job. The job requests an OIDC ID token, which is exchanged with AWS STS via the GitHub OIDC provider for temporary credentials by assuming github_actions_role, whose trust policy checks the sub and aud claims. With those credentials the job runs terraform fmt, validate and plan against the ci-demo config, then posts the plan result back as a PR comment.</desc>
<style>
  rect { rx: 8px; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  text.th { font-size: 14px; font-weight: 500; }
  text.ts { font-size: 12px; font-weight: 400; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray .th { fill: #2C2C2A; } .c-gray .ts { fill: #5F5E5A; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .c-blue .th { fill: #0C447C; } .c-blue .ts { fill: #185FA5; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="c-gray">
<rect x="270" y="20" width="180" height="56"/>
<text class="th" x="360" y="42" text-anchor="middle">Developer opens PR</text>
<text class="ts" x="360" y="60" text-anchor="middle">branch phase9-cicd -&gt; main</text>
</g>

<path d="M360,76 L360,98" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue">
<rect x="270" y="100" width="180" height="56"/>
<text class="th" x="360" y="122" text-anchor="middle">GitHub Actions job</text>
<text class="ts" x="360" y="140" text-anchor="middle">permissions: id-token write</text>
</g>

<path d="M360,156 L360,178" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="240" y="180" width="240" height="56"/>
<text class="th" x="360" y="202" text-anchor="middle">Request OIDC ID token</text>
<text class="ts" x="360" y="220" text-anchor="middle">configure-aws-credentials</text>
</g>

<path d="M360,236 L360,258" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="180" y="260" width="360" height="66"/>
<text class="th" x="360" y="282" text-anchor="middle">sts:AssumeRoleWithWebIdentity</text>
<text class="ts" x="360" y="300" text-anchor="middle">aws_iam_openid_connect_provider.github</text>
<text class="ts" x="360" y="316" text-anchor="middle">trust policy checks sub / aud claims</text>
</g>

<path d="M360,326 L360,348" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue">
<rect x="220" y="350" width="280" height="56"/>
<text class="th" x="360" y="372" text-anchor="middle">terraform fmt / validate / plan</text>
<text class="ts" x="360" y="390" text-anchor="middle">against phase9-cicd/ci-demo</text>
</g>

<path d="M360,406 L360,428" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
<rect x="230" y="430" width="260" height="56"/>
<text class="th" x="360" y="452" text-anchor="middle">Comment plan result on PR</text>
<text class="ts" x="360" y="470" text-anchor="middle">github-script posts fmt/validate/plan outcome</text>
</g>
</svg>
