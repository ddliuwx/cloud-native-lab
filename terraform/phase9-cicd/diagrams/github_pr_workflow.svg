<svg width="760" height="620" viewBox="0 0 760 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Typical GitHub pull request workflow</title>
<desc>A developer branches off main, makes local changes with fmt and commit, pushes the branch, opens a pull request, which triggers CI checks automatically. A reviewer (or the developer solo) reviews the diff and CI results; if changes are requested the developer pushes more commits back onto the same branch, retriggering CI. Once checks pass and review is approved, the PR is merged into main, and the developer syncs main locally and deletes the feature branch.</desc>
<style>
  rect { rx: 8px; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  text.th { font-size: 14px; font-weight: 500; }
  text.ts { font-size: 12px; font-weight: 400; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray .th { fill: #2C2C2A; } .c-gray .ts { fill: #5F5E5A; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .c-blue .th { fill: #0C447C; } .c-blue .ts { fill: #185FA5; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
  .arr-dash { stroke: #73726c; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="c-gray">
<rect x="290" y="20" width="200" height="56"/>
<text class="th" x="390" y="42" text-anchor="middle">新建 feature 分支</text>
<text class="ts" x="390" y="60" text-anchor="middle">git checkout -b phase9-cicd</text>
</g>

<path d="M390,76 L390,98" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue">
<rect x="270" y="100" width="240" height="56"/>
<text class="th" x="390" y="122" text-anchor="middle">本地修改 + fmt + commit</text>
<text class="ts" x="390" y="140" text-anchor="middle">terraform fmt -recursive 在前</text>
</g>

<path d="M390,156 L390,178" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue">
<rect x="270" y="180" width="240" height="56"/>
<text class="th" x="390" y="202" text-anchor="middle">推送分支到 GitHub</text>
<text class="ts" x="390" y="220" text-anchor="middle">git push -u origin phase9-cicd</text>
</g>

<path d="M390,236 L390,258" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="270" y="260" width="240" height="56"/>
<text class="th" x="390" y="282" text-anchor="middle">开 Pull Request</text>
<text class="ts" x="390" y="300" text-anchor="middle">compare: phase9-cicd -&gt; base: main</text>
</g>

<path d="M390,316 L390,338" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="270" y="340" width="240" height="56"/>
<text class="th" x="390" y="362" text-anchor="middle">CI 自动触发检查</text>
<text class="ts" x="390" y="380" text-anchor="middle">fmt / validate / plan 评论回 PR</text>
</g>

<path d="M390,396 L390,418" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
<rect x="270" y="420" width="240" height="56"/>
<text class="th" x="390" y="442" text-anchor="middle">Review（人工 / 自审）</text>
<text class="ts" x="390" y="460" text-anchor="middle">看 diff + CI 结果是否通过</text>
</g>

<path d="M270,448 C160,448 160,180 268,164" class="arr-dash" marker-end="url(#arrow)"/>
<text class="ts" x="90" y="300" text-anchor="middle" fill="#5F5E5A" transform="rotate(-90 90 300)">有修改意见 -&gt; 继续 commit + push</text>

<path d="M390,476 L390,498" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
<rect x="270" y="500" width="240" height="56"/>
<text class="th" x="390" y="522" text-anchor="middle">Merge Pull Request</text>
<text class="ts" x="390" y="540" text-anchor="middle">合并进 main（检查全绿 + 无冲突）</text>
</g>

<path d="M390,556 L390,578" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="250" y="580" width="280" height="36"/>
<text class="th" x="390" y="603" text-anchor="middle">本地同步 main + 删除 feature 分支</text>
</g>
</svg>
